name: Lint, Prettier, Build and Tests

on:
    push:
        branches: ['**']
    workflow_call:

jobs:
    build:
        permissions:
            actions: read
            contents: read
            packages: read
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: car_log_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d car_log_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            maildev:
                image: maildev/maildev:2.2.1
                ports:
                    - 1025:1025
                    - 1080:1080
        env:
            NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # Disposable CI database credentials, not a production secret.
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/car_log_test
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: './package-lock.json'
            - name: Check syntax, formatting and build
              run: |
                  npm ci
                  npm run db:generate
                  npm run db:deploy
                  npm run lint
                  npm run prettier
                  npx tsc --noEmit
                  npm run test:db
                  npm run build
            - name: Install browser
              run: npx playwright install --with-deps chromium
            - name: Browser tests (development and production)
              run: |
                  npm run test:e2e
                  E2E_PRODUCTION=true npm run test:e2e
            - name: Browser test report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
